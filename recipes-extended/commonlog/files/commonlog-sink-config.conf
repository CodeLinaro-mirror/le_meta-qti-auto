#===============================================================================
# CommonLog Sink Configuration
#
# This file contains CommonLog sink-specific runtime settings.
# Values defined here override the default sink configuration.
#===============================================================================

#------------------------------------------------------------------------------
# BusyBox Syslog Sink Configuration
#------------------------------------------------------------------------------
# BusyBox syslogd file rotation size in KB
# Equivalent to syslogd -s <size>
#SYSLOG_ROTATESIZE=1024

# Number of rotated log files to keep
# Equivalent to syslogd -b <count>
#SYSLOG_ROTATEGENS=9

# Circular shared memory buffer size in KB
# Equivalent to syslogd -C<size>
# Uncomment if buffer destination is used
#SYSLOG_BUFFERSIZE=10240

#------------------------------------------------------------------------------
# Logcat Sink Configuration
#------------------------------------------------------------------------------
# Examples: 256K, 1M, 4M, 10M, 15M
#LOGCAT_BUFFER_SIZE=10M
#
