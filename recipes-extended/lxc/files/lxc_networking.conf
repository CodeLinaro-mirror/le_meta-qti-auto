lxc.arch = aarch64
lxc.console.path = none
#for mounting minmal /dev
lxc.autodev = 1
lxc.tty.max = 2
lxc.pty.max = 1

# networking
lxc.net.0.type = veth
lxc.net.0.flags = up
lxc.net.0.name = veth0
lxc.net.0.hwaddr = 4a:49:43:49:79:bf
lxc.net.0.ipv4.address = 192.168.2.2/24 192.168.2.255
#rootfs options
lxc.rootfs.path = dir:/lxcrootfs
lxc.rootfs.managed=0
lxc.rootfs.options = ro
#mounting cgroup and proc dir
lxc.mount.auto = cgroup:mixed proc:mixed sys:ro

#ram limit
lxc.cgroup.memory.limit_in_bytes = 20000000
