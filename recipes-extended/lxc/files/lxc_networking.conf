lxc.include = /etc/lxc/qti-lxc-common.conf

# networking
lxc.net.0.type = veth
lxc.net.0.flags = up
lxc.net.0.name = veth0
lxc.net.0.hwaddr = 4a:49:43:49:79:bf
lxc.net.0.ipv4.address = 192.168.2.2/24 192.168.2.255

#RW space
lxc.mount.entry = /data/lxc_rw tmp none rw,bind 0 0
