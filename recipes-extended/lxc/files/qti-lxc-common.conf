lxc.arch = aarch64
lxc.console.path = /dev/tty_lxc

lxc.signal.halt = SIGUSR1

#for mounting minmal /dev
lxc.autodev = 1
lxc.tty.max = 4
lxc.pty.max = 3

#rootfs options
lxc.rootfs.path = dir:/lxcrootfs
lxc.rootfs.managed=0
lxc.rootfs.options = ro

#mounting cgroup and proc dir
lxc.mount.auto = cgroup:mixed proc:mixed sys:ro

#ram limit
lxc.cgroup.memory.limit_in_bytes = 30000000
