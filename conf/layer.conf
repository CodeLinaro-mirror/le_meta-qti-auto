BBFILES += "${LAYERDIR}/recipes/*/*.bb ${LAYERDIR}/recipes/*/*.bbappend ${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-products/images/*.bbappend ${LAYERDIR}/recipes-*/*/*.bbappend"
BBPATH .= ":${LAYERDIR}"
BBFILE_COLLECTIONS += "auto"
BBFILE_PRIORITY_auto = "12"
BBFILE_PATTERN_auto := "^${LAYERDIR}/"

LAYERSERIES_COMPAT_auto = "thud"

# Only use aerolink stub if no other version available
PREFERRED_VERSION_aerolink = "1.0"
