BBPATH .= ":${LAYERDIR}"
BBFILE_COLLECTIONS           += "qti-auto"
BBFILE_PRIORITY_qti-auto      = "12"
BBFILE_PATTERN_qti-auto      := "^${LAYERDIR}/"

LAYERSERIES_COMPAT_qti-auto = "dunfell kirkstone"

BBFILES += " ${LAYERDIR}/recipes-*/*/*.bb \
             ${LAYERDIR}/recipes-*/*/*.bbappend"

LICENSE_PATH += "${LAYERDIR}/files/common-licenses"

HOSTTOOLS += "python python2"
BBMASK += "meta-qti-bsp/meta-qti-customizations/core/recipes-devtools/nanopb/nanopb_0.4.3.bb"
