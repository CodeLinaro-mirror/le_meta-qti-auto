#@TYPE: Machine
#@NAME: qtiquingvm
#@DESCRIPTION: Machine configuration for QTI QUIN

BASEMACHINE ?= "qtiquingvm"
include conf/machine/include/auto-common.inc
include conf/machine/include/bbmask.inc

SERIAL_CONSOLE = "115200 ttyAMA0"

# EMMC TARGET TO SUPPORT 64-bit kernel
DISTRO = "automotive"
DEFAULTTUNE = "aarch64"

# Sizes for EXT4 (in bytes)
SYSTEM_SIZE_EXT4 ?= "100000000"
SYSTEMRW_SIZE_EXT4 ?= "8388608"
USERDATA_SIZE_EXT4 ?= "2000000000"
CACHE_SIZE_EXT4 ?= "80000000"

# Formats of root filesystem images.
IMAGE_FSTYPES += "ext4"
RECOVERY_IMAGE = "0"

KERNEL_BASE = "0x80000000"
KERNEL_TAGS_OFFSET = "0x1e00000"
KERNEL_CONFIG = "${@['vendor/qti-quin-gvm-perf_defconfig', 'vendor/qti-quin-gvm_defconfig'][d.getVar('VARIANT', True) == ('' or 'debug')]}"
KERNEL_CMD_PARAMS = " "
KERNEL_IMAGETYPE = "Image-dtb"

IMAGE_EXT4_EXTRA_OPTIONS = "${@bb.utils.contains('DISTRO_FEATURES','ro-rootfs',' -J -b 1024 ','',d)}"

require conf/multilib.conf
MULTILIBS = "multilib:lib32"
DEFAULTTUNE_virtclass-multilib-lib32 = "armv7ahf-neon"
DISTRO_FEATURES_append= " ab-boot-support"

BBMASK += "meta-qti-auto/recipes-agl/dbus/dbus-glib_%.bbappend"
BBMASK += "meta-qti-auto/recipes-agl/dbus/dbus_%.bbappend"
BBMASK += "meta-qti-auto/recipes-agl/dbus/libdbus-c\+\+_0.9.0.bbappend"
BBMASK += "meta-qti-auto/recipes-agl/lightmediascanner/lightmediascanner_0.5.1.bb"
BBMASK += "meta-qti-auto/recipes-agl/connman/connman-conf.bbappend"
BBMASK += "meta-qti-auto/recipes-agl/connman/connman_%.bbappend"
BBMASK += "meta-qti-auto/recipes-agl/opencv/opencv_3.3.bbappend"
BBMASK += "meta-qti-auto/recipes-agl/udisks/udisks_1.0.5.bbappend"
BBMASK += "meta-qti-auto/recipes-agl/dbus-cynara/dbus-cynara_1.10.20.bb"
BBMASK += "meta-qti-auto/recipes-agl/dbus-cynara/dbus-cynara_%.bbappend"
BBMASK += "meta-qti-auto/recipes-agl/bash-completion/bash-completion_%.bbappend"
BBMASK += "meta-qti-auto/recipes-agl/agl-login-manager/agl-login-manager_0.1.bbappend"
BBMASK += "meta-qti-auto/recipes-agl/agl-users/agl-users_0.1.bbappend"
BBMASK += "meta-qti-auto/recipes-agl/cynara/cynara_%.bbappend"
BBMASK += "meta-qti-auto/recipes-agl/navigation/navigation_%.bbappend"
BBMASK += "meta-qti-auto/recipes-agl/packagegroup/packagegroup-agl-appfw-graphics.bbappend"
BBMASK += "meta-qti-auto/recipes-agl/packagegroup/packagegroup-agl-appfw-native-qt5.bbappend"
BBMASK += "meta-qti-auto/recipes-agl/packagegroup/packagegroup-agl-demo-platform.bbappend"
BBMASK += "meta-qti-auto/recipes-agl/packagegroup/packagegroup-agl-demo.bbappend"
BBMASK += "meta-qti-auto/recipes-agl/packagegroup/packagegroup-agl-ivi-connectivity.bbappend"
BBMASK += "meta-qti-auto/recipes-agl/packagegroup/packagegroup-ivi-common-core-graphics.bbappend"
BBMASK += "meta-qti-auto/recipes-agl/phone/phone_git.bbappend"
BBMASK += "meta-qti-auto/recipes-agl/run-agl-postinsts/run-agl-postinsts_1.0.bbappend"
BBMASK += "meta-qti-auto/recipes-agl/security-manager/security-manager_%.bbappend"
