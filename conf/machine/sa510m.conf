#@TYPE: Machine
#@NAME: SA510M
#@DESCRIPTION: Machine configuration for SA510M NAND

require conf/machine/include/sa510m.inc

# MACHINE_FEATURES ##
MACHINE_FEATURES += "nand-boot qti-nad-core qti-nad-mrc"

# Formats of root filesystem images
IMAGE_FSTYPES = "ubi"

# Sizes for UBI volumes
SYSTEM_VOLUME_SIZE = "115MiB"
CACHE_VOLUME_SIZE    = "10MiB"
SYSTEMRW_VOLUME_SIZE = "6MiB"
PERSIST_VOLUME_SIZE  = "4MiB"
MODEM_VOLUME_SIZE = "60MiB"

# Sizes for UBI squashfs volumes
SYSTEM_SQUASHFS_VOLUME_SIZE = "${@bb.utils.contains('DEBUG_BUILD', '1', '85MiB', '80MiB', d)}"
MODEM_SQUASHFS_VOLUME_SIZE = "45MiB"

# UBI arguments
UBINIZE_ARGS = "-m 4096 -p 256KiB -s 4096"
MKUBIFS_ARGS = "-m 4096 -e 253952 -c 2146 -F"
MKUBIFS_USERFS_ARGS = "-m 4096 -e 253952 -c 6144 -F"

# File indicating firmware residing places on device.
MACHINE_FILESMAP_CONF = "sa510m-filesmap"

MACHINE_FSCONFIG_CONF = "sa525m-emmc-fsconfig.conf"

MACHINE_SUPPORTS_DISPLAY = "False"
