#@TYPE: Machine
#@NAME: SA510M
#@DESCRIPTION: Machine configuration for SA510M NAND

require conf/machine/include/sa510m.inc

# MACHINE_FEATURES ##
MACHINE_FEATURES += "nand-boot"

# Formats of root filesystem images
IMAGE_FSTYPES = "ubi"

FLAVOR = "pvm"
# Sizes for UBI volumes
SYSTEM_VOLUME_SIZE = "82MiB"
CACHE_VOLUME_SIZE    = "10MiB"
SYSTEMRW_VOLUME_SIZE = "6MiB"
PERSIST_VOLUME_SIZE  = "4MiB"
MODEM_VOLUME_SIZE = "52MiB"
#VM_BOOTSYS_VOLUME_SIZE = "128MiB"
#LXCRFS_VOLUME_SIZE = "18MiB"

# Sizes for UBI squashfs volumes
SYSTEM_SQUASHFS_VOLUME_SIZE = "${@bb.utils.contains('DEBUG_BUILD', '1', '85MiB', '80MiB', d)}"
MODEM_SQUASHFS_VOLUME_SIZE = "95MiB"
#TELAF_SQUASHFS_VOLUME_SIZE = "10MiB"
#TELAF_APP_VOLUME_SIZE = "20MiB"
#VM_BOOTSYS_SQUASHFS_VOLUME_SIZE = "80MiB"
#LXCRFS_SQUASHFS_VOLUME_SIZE = "12MiB"

# UBI arguments
UBINIZE_ARGS = "-m 4096 -p 256KiB -s 4096"
MKUBIFS_ARGS = "-m 4096 -e 253952 -c 2146 -F"
MKUBIFS_USERFS_ARGS = "-m 4096 -e 253952 -c 6144 -F"

# Disable autosuspend for USB peripheral mode
MACHINE_SUPPORTS_USB_AUTOSUSPEND = "False"

# File indicating firmware residing places on device.
MACHINE_FILESMAP_CONF = "sa510m-filesmap"

MACHINE_FSCONFIG_CONF = "sa525m-emmc-fsconfig.conf"

DISTRO_FEATURES:remove = "qti-telux"

INHERIT += "utils base patch staging"
USER_CLASSES += "staging base"

BBMASK += " meta-qti-bsp/meta-qti-customizations/core/recipes-devtools/subversion/subversion_%.bbappend \
            meta-qti-bsp/meta-qti-customizations/core/recipes-devtools/rpm/rpm_%.bbappend \
            meta-qti-bsp/meta-qti-customizations/core/recipes-devtools/e2fsprogs/e2fsprogs_%.bbappend \
            meta-qti-bsp/meta-qti-customizations/core/recipes-kernel/dtc/dtc_%.bbappend \
            meta-qti-bsp/recipes-kernel/kmod/kmod_%.bbappend \
            meta-qti-bsp/recipes-core/ncurses/ncurses_%.bbappend \
            meta-qti-bsp/recipes-devtools/squashfs-tools/squashfs-tools_git.bbappend \
            meta-qti-auto/recipes-core/zlib/zlib_%.bbappend \
            meta-qti-bsp/meta-qti-customizations/core/recipes-devtools/binutils/* \
            meta-qti-bsp/meta-qti-customizations/core/recipes-devtools/perl/perl_%.bbappend \
            meta-qti-bsp/recipes-connectivity/chrony/chrony_2.4.bb \
            "
