#@TYPE: Machine
#@NAME: SA525M-EMMC
#@DESCRIPTION: Machine configuration for SA525M EMMC

require conf/machine/include/sa525m.inc

# MACHINE_FEATURES ##
MACHINE_FEATURES += "emmc-boot qti-ab-boot qti-nad-core ckmhal_kmlite qti-stream-update"

# Sizes for EXT4 (in bytes)
SYSTEM_SIZE_EXT4  = "309329920"
USERDATA_SIZE_EXT4 = "251658240"
CACHE_SIZE_EXT4 = "26214400"
SYSTEMRW_SIZE_EXT4 = "8192000"
PERSIST_SIZE_EXT4  = "6291456"

SDCARD_DEVICE = "mmcblk1p1"
SLOT_A_SUFFIX = ""

# Formats of root filesystem images
IMAGE_FSTYPES += "ext4"
#MACHINE_SUPPORTS_INIT_RAMDISK = "True"
#TOYBOX_RAMDISK = "True"
MACHINE_FSCONFIG_CONF = "sa525m-emmc-fsconfig.conf"

# File indicating firmware residing places on device.
MACHINE_FILESMAP_CONF = "sa525m-emmc-filesmap"

MACHINE_PARTITION_CONF = "sa525m-partition.conf"

MACHINE_FEATURES:remove += "qti-recovery qti-nad-telaf"

FLAVOR = "pvm"
