#                                              #
# Configuration for ASM330 Sensor              #
# ACC_RANGE  0:2G 1:4G 2:8G 3:16G              #
# GYRO_RANGE 0:125dps 1:250dps 2:500dps        #
#            3:1000dps 4:2000dps 5:4000dps     #
# ACC_BUFF_RANGE  0:2G 1:4G 2:8G 3:16G         #
# GYRO_BUFF_RANGE 0:125dps 1:250dps 2:500dps   #
#            3:1000dps 4:2000dps 5:4000dps     # 
#                                              #
# For buffer range, please make sure that it   #
# aligns with the range defined in the driver. #
# The range value here is only used for scaling#
# factor.                                      #
################################################
SENSOR_VENDOR=1
SENSOR_HAL_LIB_PATH=/usr/lib/libasm330sensors.so.1.0.0
ACC_RANGE=0
GYRO_RANGE=0
ACC_BUFF_RANGE=0
GYRO_BUFF_RANGE=0
