################################################
ACCEL_NAME=Accel
GYRO_NAME=Gyro
################################################
# DEBUG LEVELS: 0 - none, 1 - Error, 2 - Warning, 3 - Info
#               4 - Debug, 5 - Verbose
# If DEBUG_LEVEL is commented, no logs will print
DEBUG_LEVEL=1
################################################
#
# MAX SAMPLING RATE AND MIN BATCHING COUNT
MAX_ACC_SAMPLING_RATE=104
MAX_GYRO_SAMPLING_RATE=104
MIN_ACC_BATCH_COUNT=10
MIN_GYRO_BATCH_COUNT=10
################################################

# DIAG_CLIENTS=SHD,CLIENT   (SHD enables the dia from sensor hal daemon, client enables diag logs from clients)
DIAG_CLIENTS=
################################################

#FIR Filter coefficients
#Filter coefficients should have suffix "sensorrate_samplingrate" indicating that the coefficient is relavant when 
#downsampling from "sensor_rate" to "sampling_rate". 
#Eg: FIR_COEFFICIENT_ACC_400_100 (suffix=400_100) is the coefficients used when downsampling from 400Hz to 100Hz.
#If the coefficient is not set (or invalid) default algorithm used for down sampling

################################################
#ENABLE_FIR is used to enable / disable FIR filter.
#IF FIR is enabled, FIR coefficients should be defined
ENABLE_FIR=0

#FIR_COEFFICIENT_ACC_400_200=1/2,1/2
#FIR_COEFFICIENT_GYRO_400_200=1/12,3/12,4/12,3/12,1/12

#FIR_COEFFICIENT_ACC_400_100=1/12,3/12,4/12,3/12,1/12
#FIR_COEFFICIENT_GYRO_400_100=1/45,3/45,6/45,8/45,9/45,8/45,6/45,3/45,1/45

#FIR_COEFFICIENT_ACC_200_100=1/2,1/2
#FIR_COEFFICIENT_GYRO_200_100=1/12,3/12,4/12,3/12,1/12
################################################

############################################################
# Enable flag for voluntary self test during device suspend
# SELF_TEST = 1 to enable
# SELF_TEST = 0 to disable
############################################################
SELF_TEST=0
