[Service]
ExecStart=+/bin/chmod 0220 /dev/socket/logdw
ExecStart=+/bin/chmod 0440 /dev/socket/logdr
ExecStart=+/bin/chmod 0660 /dev/socket/logd
ExecStopPost=-/bin/rm -rf /dev/socket/logd*
