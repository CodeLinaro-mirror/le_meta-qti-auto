[Unit]
DefaultDependencies=no
Conflicts=shutdown.target
After=tmp.mount
Requires=tmp.mount

[Service]
ExecStartPre=+/sbin/mount-copybind /systemrw/dlt-log-levels.conf /etc/dlt-log-levels.conf
ExecStartPre=+/sbin/mount-copybind /systemrw/dlt.conf /etc/dlt.conf
ExecStop=+/sbin/umount-copybind /etc/dlt-log-levels.conf
ExecStop=+/sbin/umount-copybind /etc/dlt.conf

[Install]
WantedBy=
WantedBy=local-fs.target
