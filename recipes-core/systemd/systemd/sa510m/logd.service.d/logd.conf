[Unit]
DefaultDependencies=no
After=init_sys_mss.service
Before=systemd-udev-trigger.service sockets.target

[Service]
Nice=-5
ExecStart=
ExecStart=/bin/sh -c '/bin/chmod 0220 /dev/socket/logdw && /bin/chmod 0660 /dev/socket/logdr /dev/socket/logd'
