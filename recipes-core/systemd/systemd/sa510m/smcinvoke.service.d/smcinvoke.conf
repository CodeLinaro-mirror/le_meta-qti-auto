[Unit]
DefaultDependencies=no
After=init_sys_mss.service
Before=systemd-udev-trigger.service sockets.target

[Service]
ExecStart=
ExecStart=/bin/sh -c 'if grep -q smcinvoke /proc/modules; then exit 0; else exec /etc/initscripts/start_smcinvoke_le start; fi'
ExecStartPost=+/bin/udevadm trigger --subsystem-match=smcinvoke --action=add
ExecStartPost=+/bin/udevadm settle
SupplementaryGroups=leprop
Nice=-5

