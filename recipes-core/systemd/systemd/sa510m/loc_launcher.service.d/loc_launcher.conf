[Unit]
After=qwesd.service init-can.service logd.service sensor_hal_daemon.service
DefaultDependencies=no
Before=systemd-udev-trigger.service sockets.target

[Service]
Nice=-15
SupplementaryGroups=logd leprop
ExecStartPre=+/bin/sh -c '/sbin/mount-copybind /systemrw/gps.conf /etc/gps.conf && /sbin/mount-copybind /systemrw/izat.conf /etc/izat.conf'

[Install]
WantedBy=sockets.target

