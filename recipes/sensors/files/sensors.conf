# Sensor HAL Provider Configuration HAL Library name including path
################################################
#                                              #
# Configuration for ASM330 Sensor              #
#                                              #
################################################
SENSOR_TYPE=1
ACCEL_NAME=Accel
GYRO_NAME=Gyro
SENSOR_HAL_LIB_PATH=/usr/lib/libasm330sensors.so.1.0.0
# ACC_RANGE 0:2G 1:4G 2:8G 3:16G
# GYRO_RANGE 0:125dps 1:250dps 2:500dps 3:1000dps 4:2000dps 5:4000dps
ACC_RANGE=0
GYRO_RANGE=0
################################################
# DEBUG LEVELS: 0 - none, 1 - Error, 2 - Warning, 3 - Info
#               4 - Debug, 5 - Verbose
# If DEBUG_LEVEL is commented, no logs will print
DEBUG_LEVEL=1
################################################
#
# MAX SAMPLING RATE AND MIN BATCHING COUNT
MAX_ACC_SAMPLING_RATE=104
MAX_GYRO_SAMPLING_RATE=104
MIN_ACC_BATCH_COUNT=10
MIN_GYRO_BATCH_COUNT=10
################################################
