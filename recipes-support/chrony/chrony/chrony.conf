# Disable public NTP servers by default. GNSS is expected to be the
# main time source, with MNO time getting set when GNSS not available.
# In a system with no MNO and internet coming from another interface,
# uncomment this line to use the public NTP servers.
# pool 0.openembedded.pool.ntp.org iburst maxsources 3

# Sync the start of the second based on the 1PPS signal
refclock PPS /dev/pps0 refid KPPS trust lock GNSS maxdispersion 3 poll 2

# Provide GNSS time samples using the SOCK interface
refclock SOCK /var/run/chrony.sock refid GNSS maxdispersion 0.2 noselect

# Step the system clock instead of slew if the adjustment
# is larger than 0.1 second.
makestep 0.1 -1

# Serve time even if not synchronized to any NTP server.
local stratum 10

# Allow NTP client access from local network.
allow all
